name: alexa-web-prod
services:
  app:
    container_name: alexa-web-prod
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    expose:
      - "3000"
    env_file:
      - ../../src/.env.local
      - ../../src/.env.example
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_YANDEX_MAPS_API_KEY=${NEXT_PUBLIC_YANDEX_MAPS_API_KEY:-}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
