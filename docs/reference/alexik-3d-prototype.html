<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Алексик в 3D</title>
<style>
  :root {
    --bg: #e3f3f1;
    --ink: #2f4a48;
    --soft: #6c8c89;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #16292a; --ink: #e2f1ef; --soft: #8fb0ac; }
  }
  :root[data-theme="dark"] { --bg: #16292a; --ink: #e2f1ef; --soft: #8fb0ac; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Nunito", "Trebuchet MS", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  /* Блок, который можно перенести на свой сайт */
  #alexik {
    width: min(92vw, 520px);
    aspect-ratio: 1 / 1;
    position: relative;
    cursor: grab;
    touch-action: none;
    outline: none;
  }
  #alexik:active { cursor: grabbing; }
  #alexik:focus-visible { box-shadow: 0 0 0 3px var(--soft); border-radius: 24px; }
  #alexik canvas { display: block; width: 100%; height: 100%; }
  .hint { margin: 4px 0 0; font-size: 15px; color: var(--soft); text-align: center; }
</style>
</head>
<body>

<script>
(function () {
  const host = document.getElementById('alexik');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- Рендер ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  host.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
  camera.position.set(0, 0.2, 13);

  // ---------- Свет ----------
  scene.add(new THREE.HemisphereLight(0xffffff, 0xb9d9d5, 0.75));
  const key = new THREE.DirectionalLight(0xffffff, 0.85);
  key.position.set(4, 6, 7);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xcdf0ff, 0.5);
  rim.position.set(-6, 3, -5);
  scene.add(rim);
  const fill = new THREE.DirectionalLight(0xfff1f4, 0.25);
  fill.position.set(-5, -2, 6);
  scene.add(fill);

  // ---------- Материалы ----------
  const enamel = new THREE.MeshPhysicalMaterial({
    color: 0xf3f3f1, roughness: 0.38, metalness: 0,
    clearcoat: 0.7, clearcoatRoughness: 0.25
  });
  // Лицо — плоские цвета ровно как в PNG, без влияния света и тонмаппинга
  const flat = hex => new THREE.MeshBasicMaterial({
    color: new THREE.Color(hex).convertSRGBToLinear(), toneMapped: false
  });
  const dark = flat(0x333333);
  const pink = flat(0xffa1d3);

  // ---------- Тело: силуэт с картинки (координаты в пикселях исходника) ----------
  const p = (x, y) => [(x - 325) / 100, -(y - 260) / 100];
  const shape = new THREE.Shape();
  shape.moveTo(...p(325, 15));
  const bz = (a, b, c) => shape.bezierCurveTo(...p(...a), ...p(...b), ...p(...c));
  bz([470, 12], [545, 28], [566, 95]);
  bz([588, 160], [584, 232], [570, 272]);
  bz([545, 365], [482, 470], [428, 502]);
  bz([398, 518], [372, 500], [364, 448]);
  bz([352, 370], [348, 285], [325, 283]);
  bz([302, 285], [298, 370], [286, 448]);
  bz([278, 500], [252, 518], [222, 502]);
  bz([168, 470], [105, 365], [84, 272]);
  bz([70, 232], [64, 160], [86, 95]);
  bz([106, 28], [180, 12], [325, 15]);

  // «Надувает» плоский силуэт в пухлую форму: спереди и сзади купол,
  // по краю — круглый бортик, как у мягкой игрушки.
  function inflate(shape, o) {
    const C = shape.getSpacedPoints(Math.ceil(shape.getLength() / o.step));
    C.pop();
    if (THREE.ShapeUtils.isClockWise(C)) C.reverse();
    const n = C.length;
    const sx = C.map(c => c.x), sy = C.map(c => c.y);

    const inside = (x, y) => {
      let r = false;
      for (let i = 0, j = n - 1; i < n; j = i++) {
        if ((sy[i] > y) !== (sy[j] > y) &&
            x < (sx[j] - sx[i]) * (y - sy[i]) / (sy[j] - sy[i]) + sx[i]) r = !r;
      }
      return r;
    };
    const dist = (x, y) => {
      let m = Infinity;
      for (let i = 0, j = n - 1; i < n; j = i++) {
        const ax = sx[j], ay = sy[j], dx = sx[i] - ax, dy = sy[i] - ay;
        let t = ((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy);
        t = t < 0 ? 0 : t > 1 ? 1 : t;
        const ex = ax + dx * t - x, ey = ay + dy * t - y;
        const d = ex * ex + ey * ey;
        if (d < m) m = d;
      }
      return Math.sqrt(m);
    };

    const P = [], D = [];
    for (let i = 0; i < n; i++) { P.push(sx[i], sy[i]); D.push(0); }

    // кольца у края — чтобы закругление было гладким
    for (const off of o.rings) {
      const every = off < o.step * 1.5 ? 1 : 2;
      for (let i = 0; i < n; i += every) {
        const a = (i - 1 + n) % n, b = (i + 1) % n;
        let tx = sx[b] - sx[a], ty = sy[b] - sy[a];
        const l = Math.hypot(tx, ty) || 1;
        const x = sx[i] - ty / l * off, y = sy[i] + tx / l * off;
        if (!inside(x, y)) continue;
        const d = dist(x, y);
        if (Math.abs(d - off) < off * 0.3) { P.push(x, y); D.push(d); }
      }
    }
    // сетка внутри
    const minD = o.rings[o.rings.length - 1] + o.grid * 0.5;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    sx.forEach(v => { minX = Math.min(minX, v); maxX = Math.max(maxX, v); });
    sy.forEach(v => { minY = Math.min(minY, v); maxY = Math.max(maxY, v); });
    let row = 0;
    for (let y = minY; y <= maxY; y += o.grid * 0.866, row++) {
      for (let x = minX + (row % 2) * o.grid / 2; x <= maxX; x += o.grid) {
        if (!inside(x, y)) continue;
        const d = dist(x, y);
        if (d > minD) { P.push(x, y); D.push(d); }
      }
    }

    const del = new Delaunator(P);
    const nv = D.length, tris = [];
    for (let k = 0; k < del.triangles.length; k += 3) {
      let a = del.triangles[k], b = del.triangles[k + 1], c = del.triangles[k + 2];
      const cx = (P[2*a] + P[2*b] + P[2*c]) / 3, cy = (P[2*a+1] + P[2*b+1] + P[2*c+1]) / 3;
      if (!inside(cx, cy)) continue;
      const cr = (P[2*b] - P[2*a]) * (P[2*c+1] - P[2*a+1]) - (P[2*b+1] - P[2*a+1]) * (P[2*c] - P[2*a]);
      if (cr < 0) { const t = b; b = c; c = t; }
      tris.push(a, b, c);
    }

    // высота: круглый бортик + мягкий купол
    const Z = new Float32Array(nv);
    for (let i = 0; i < nv; i++) {
      if (D[i] === 0) continue;
      const t = Math.min(D[i] / o.R, 1);
      const s = Math.min(D[i] / (o.R * 1.6), 1);
      Z[i] = o.H * Math.sqrt(1 - (1 - t) * (1 - t)) +
             o.dome(P[2*i], P[2*i+1]) * s * s * (3 - 2 * s);
    }
    // сглаживаем внутренние складки, край не трогаем
    const nb = Array.from({ length: nv }, () => new Set());
    for (let k = 0; k < tris.length; k += 3) {
      const [a, b, c] = [tris[k], tris[k+1], tris[k+2]];
      nb[a].add(b).add(c); nb[b].add(a).add(c); nb[c].add(a).add(b);
    }
    const lock = o.R * 0.45;
    for (let it = 0; it < o.smooth; it++) {
      const Z2 = Z.slice();
      for (let i = 0; i < nv; i++) {
        if (D[i] < lock || !nb[i].size) continue;
        let s = 0; nb[i].forEach(j => (s += Z[j]));
        Z2[i] = 0.5 * Z[i] + 0.5 * s / nb[i].size;
      }
      Z.set(Z2);
    }

    // перед и зад; точки края общие, поэтому шов не виден
    const back = new Int32Array(nv);
    const pos = [];
    for (let i = 0; i < nv; i++) pos.push(P[2*i], P[2*i+1], Z[i]);
    let next = nv;
    for (let i = 0; i < nv; i++) {
      if (D[i] === 0) back[i] = i;
      else { back[i] = next++; pos.push(P[2*i], P[2*i+1], -Z[i]); }
    }
    const idx = [];
    for (let k = 0; k < tris.length; k += 3) {
      idx.push(tris[k], tris[k+1], tris[k+2]);
      idx.push(back[tris[k]], back[tris[k+2]], back[tris[k+1]]);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setIndex(idx);
    geo.computeVertexNormals();

    // точка на поверхности спереди: высота и нормаль ближайшей вершины
    geo.userData.surfaceAt = (x, y) => {
      let best = 0, bd = Infinity;
      for (let i = 0; i < nv; i++) {
        const d = (P[2*i] - x) ** 2 + (P[2*i+1] - y) ** 2;
        if (d < bd) { bd = d; best = i; }
      }
      const nrm = geo.attributes.normal;
      return { z: Z[best], normal: new THREE.Vector3(nrm.getX(best), nrm.getY(best), nrm.getZ(best)).normalize() };
    };
    return geo;
  }

  const bodyGeo = inflate(shape, {
    step: 0.035, grid: 0.075, rings: [0.012, 0.035, 0.07, 0.12, 0.18],
    R: 0.8, H: 0.8, smooth: 25,
    dome: (x, y) => 0.45 * Math.max(0, 1 - (x / 2.7) ** 2 - ((y - 0.9) / 2.2) ** 2)
  });

  const character = new THREE.Group();      // вращение и наклон
  const bouncer = new THREE.Group();        // прыжки и сжатие
  scene.add(bouncer);
  bouncer.add(character);
  character.add(new THREE.Mesh(bodyGeo, enamel));

  // ставит деталь лица на выпуклую поверхность и поворачивает по нормали
  const Z_AXIS = new THREE.Vector3(0, 0, 1);
  function stick(mesh, x, y, lift = 0.012, spin = 0) {
    const s = bodyGeo.userData.surfaceAt(x, y);
    mesh.position.set(x, y, s.z).addScaledVector(s.normal, lift);
    mesh.quaternion.setFromUnitVectors(Z_AXIS, s.normal)
      .multiply(new THREE.Quaternion().setFromAxisAngle(Z_AXIS, spin));
  }

  // ---------- Лицо ----------
  const face = new THREE.Group();
  character.add(face);

  function roundedBar(w, h) {
    const r = h / 2, s = new THREE.Shape();
    s.moveTo(-w / 2 + r, -r);
    s.lineTo(w / 2 - r, -r);
    s.absarc(w / 2 - r, 0, r, -Math.PI / 2, Math.PI / 2, false);
    s.lineTo(-w / 2 + r, r);
    s.absarc(-w / 2 + r, 0, r, Math.PI / 2, Math.PI * 1.5, false);
    return new THREE.ExtrudeGeometry(s, { depth: 0.03, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.015, bevelSegments: 3 });
  }
  const eyeGeo = roundedBar(0.52, 0.1);
  const eyes = [-1.03, 1.07].map(x => {
    const m = new THREE.Mesh(eyeGeo, dark);
    stick(m, x, 1.28, 0.01);
    face.add(m);
    return m;
  });

  // счастливые глазки ^^ (появляются по клику)
  const happyGeo = new THREE.TorusGeometry(0.2, 0.045, 12, 32, Math.PI);
  const happyEyes = [-1.03, 1.07].map(x => {
    const m = new THREE.Mesh(happyGeo, dark);
    stick(m, x, 1.2, 0.03);
    m.visible = false;
    face.add(m);
    return m;
  });

  const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.045, 12, 32, Math.PI), dark);
  stick(mouth, 0.07, 1.27, 0.03, Math.PI);
  face.add(mouth);

  const cheekGeo = new THREE.CircleGeometry(0.15, 40);
  const cheeks = [[-0.69, 0.88], [0.75, 0.88]].map(([x, y]) => {
    const m = new THREE.Mesh(cheekGeo, pink);
    stick(m, x, y, 0.012);
    face.add(m);
    return m;
  });

  // ---------- Ручки ----------
  // Силуэт ручки снят с PNG (левая ручка), плечо спрятано внутри тела
  const SH = [95, 258];                         // точка плеча в пикселях
  const q = (x, y) => [(x - SH[0]) / 100, -(y - SH[1]) / 100];
  const armShape = new THREE.Shape();
  armShape.moveTo(...q(118, 222));
  armShape.bezierCurveTo(...q(96, 222), ...q(84, 262), ...q(58, 279));
  armShape.bezierCurveTo(...q(42, 289), ...q(22, 288), ...q(13, 296));
  armShape.bezierCurveTo(...q(2, 306), ...q(8, 324), ...q(26, 324));
  armShape.bezierCurveTo(...q(58, 324), ...q(88, 306), ...q(104, 286));
  armShape.bezierCurveTo(...q(118, 270), ...q(128, 240), ...q(118, 222));
  const armGeo = inflate(armShape, {
    step: 0.02, grid: 0.035, rings: [0.006, 0.018, 0.04, 0.07],
    R: 0.22, H: 0.26, smooth: 10, dome: () => 0
  });

  function makeArm(side) {
    const pivot = new THREE.Group();
    const [sx, sy] = p(...SH);
    pivot.position.set(side * -sx, sy, 0);
    const mesh = new THREE.Mesh(armGeo, enamel);
    mesh.scale.x = -side;                       // правая ручка — зеркальная копия
    pivot.add(mesh);
    character.add(pivot);
    return pivot;
  }
  const armL = makeArm(-1);
  const armR = makeArm(1);

  // ---------- Мягкая тень ----------
  const sc = document.createElement('canvas');
  sc.width = sc.height = 128;
  const g = sc.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(30,60,58,0.35)');
  grad.addColorStop(1, 'rgba(30,60,58,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(5, 1.4),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sc), transparent: true, depthWrite: false })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = -3.1;
  scene.add(shadow);

  // ---------- Размер ----------
  function resize() {
    const w = host.clientWidth, h = host.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(host);
  resize();

  // ---------- Взаимодействие ----------
  let lookX = 0, lookY = 0;          // куда смотрит за курсором
  let spin = 0, spinVel = 0;         // вращение перетаскиванием
  let dragging = false, downX = 0, lastX = 0, moved = 0;
  let joyT = -10;                    // время последнего клика

  window.addEventListener('pointermove', e => {
    const r = host.getBoundingClientRect();
    lookX = THREE.MathUtils.clamp((e.clientX - (r.left + r.width / 2)) / r.width, -1, 1);
    lookY = THREE.MathUtils.clamp((e.clientY - (r.top + r.height / 2)) / r.height, -1, 1);
    if (dragging) {
      const dx = e.clientX - lastX;
      lastX = e.clientX;
      moved += Math.abs(dx);
      spin += dx * 0.012;
      spinVel = dx * 0.012;
    }
  });
  host.addEventListener('pointerdown', e => {
    dragging = true; moved = 0; downX = lastX = e.clientX;
    host.setPointerCapture(e.pointerId);
  });
  host.addEventListener('pointerup', () => {
    dragging = false;
    if (moved < 6) cheer();
  });
  host.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cheer(); }
  });
  function cheer() { joyT = clock.getElapsedTime(); }

  // ---------- Анимация ----------
  const clock = new THREE.Clock();
  const ease = (a, b, k) => a + (b - a) * k;

  function tick() {
    const t = clock.getElapsedTime();
    const motion = reduceMotion ? 0 : 1;

    // инерция вращения и возврат лицом к зрителю
    if (!dragging) {
      spin += spinVel;
      spinVel *= 0.93;
      if (Math.abs(spinVel) < 0.002) {
        const target = Math.round(spin / (Math.PI * 2)) * Math.PI * 2;
        spin = ease(spin, target, 0.04);
      }
    }

    character.rotation.y = ease(character.rotation.y, spin + lookX * 0.45, 0.08);
    character.rotation.x = ease(character.rotation.x, lookY * 0.18, 0.08);
    character.rotation.z = Math.sin(t * 1.3) * 0.03 * motion;

    // радость по клику: прыжок, взмах, глазки ^^
    const j = t - joyT;
    const joyful = j >= 0 && j < 1.6;
    let jump = 0, squash = 0;
    if (j >= 0 && j < 0.7) {
      jump = Math.sin((j / 0.7) * Math.PI) * 0.9;
      squash = j < 0.1 ? Math.sin(j / 0.1 * Math.PI) * 0.12 : 0;
    } else if (j >= 0.7 && j < 0.85) {
      squash = Math.sin(((j - 0.7) / 0.15) * Math.PI) * 0.1;
    }
    jump *= motion || 0.3;

    const float = Math.sin(t * 1.8) * 0.12 * motion;
    bouncer.position.y = float + jump;
    bouncer.scale.set(1 + squash, 1 - squash, 1 + squash);

    const shadowScale = 1 - (float + jump) * 0.35;
    shadow.scale.set(shadowScale, 1, shadowScale);
    shadow.material.opacity = 0.9 - jump * 0.4;

    // ручки
    const sway = Math.sin(t * 1.8 + 0.6) * 0.08 * motion;
    const idleL = -sway;
    let rTarget = sway;
    if (joyful) rTarget = 1.5 + Math.sin(j * 16) * 0.3;
    armL.rotation.z = ease(armL.rotation.z, joyful ? -0.35 : idleL, 0.15);
    armR.rotation.z = ease(armR.rotation.z, rTarget, 0.15);

    eyes.forEach(m => (m.visible = !joyful));
    happyEyes.forEach(m => (m.visible = joyful));
    const blush = joyful ? 1.35 : 1;
    cheeks.forEach(c => {
      const s = ease(c.scale.x, blush, 0.12);
      c.scale.set(s, s, 1);
    });

    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
