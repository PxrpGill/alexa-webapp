name: CI

on:
  # На push в master CI не дублируем: deploy.yml вызывает этот файл как
  # reusable workflow и сам прогоняет typecheck/build перед выкаткой.
  pull_request:
    branches: [master]
    paths: ["src/**"]
  workflow_dispatch:
  # ci.yml вызывается из deploy.yml как reusable workflow (jobs.ci: uses: ...),
  # для этого обязателен триггер workflow_call.
  workflow_call:

defaults:
  run:
    working-directory: src

jobs:
  # Линт временно отключён в CI. Раскомментировать, когда починим замечания.
  # lint:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - uses: pnpm/action-setup@v4
  #       with:
  #         # package.json лежит в src/, а working-directory на `uses` не влияет —
  #         # без этого action не находит packageManager и падает
  #         package_json_file: src/package.json
  #
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 24
  #         cache: pnpm
  #         cache-dependency-path: src/pnpm-lock.yaml
  #
  #     - run: pnpm install --frozen-lockfile
  #     - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # package.json лежит в src/, а working-directory на `uses` не влияет —
          # без этого action не находит packageManager и падает
          package_json_file: src/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # package.json лежит в src/, а working-directory на `uses` не влияет —
          # без этого action не находит packageManager и падает
          package_json_file: src/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # Страницы пререндерятся и на этапе сборки ходят в API; без
          # доступного бэкенда `next build` падает. Адрес можно переопределить
          # через Settings → Secrets and variables → Actions → Variables.
          API_URL: ${{ vars.API_URL || 'https://pxrpgill-cloudy.com' }}
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL || 'https://pxrpgill-cloudy.com' }}
