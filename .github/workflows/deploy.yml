name: Deploy

on:
  push:
    branches: [main]
    paths: ["src/**"]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: [ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/alexa-webapp

            git pull

            cd docker/prod
            # make подставляет API_URL/NEXT_PUBLIC_API_URL из src/.env.local
            # как build-аргументы — голый docker compose build их не получит
            make build
            make up

            # очистка старых образов
            docker image prune -f
